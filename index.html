<!DOCTYPE html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="/logo-dpmd.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
		
		<!-- PWA Meta Tags -->
		<meta name="theme-color" content="#ffffff" />
		<meta name="description" content="Sistem Informasi Dinas Pemberdayaan Masyarakat dan Desa Kabupaten Bogor" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="msapplication-navbutton-color" content="#ffffff" />
		<meta name="msapplication-TileColor" content="#ffffff" />
		<meta name="apple-mobile-web-app-title" content="DPMD" />
		<meta name="mobile-web-app-capable" content="yes" />
		
		<!-- Manifest -->
		<link rel="manifest" href="/manifest.json" />
		
		<title>DPMD Kabupaten Bogor</title>

		<!-- Splash Screen Styles (shown before React loads) -->
		<style>
			#splash-screen {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background: #ffffff;
				transition: opacity 0.5s ease, visibility 0.5s ease;
			}
			#splash-screen.hide {
				opacity: 0;
				visibility: hidden;
			}
			#splash-logo {
				width: 120px;
				height: 120px;
				animation: splashPulse 1.8s ease-in-out infinite, splashFadeIn 0.6s ease-out;
			}
			#splash-text {
				margin-top: 24px;
				font-family: system-ui, -apple-system, sans-serif;
				font-size: 20px;
				font-weight: 700;
				color: #1f2937;
				letter-spacing: 0.5px;
				animation: splashFadeIn 0.8s ease-out 0.2s both;
			}
			#splash-subtitle {
				margin-top: 8px;
				font-family: system-ui, -apple-system, sans-serif;
				font-size: 12px;
				color: #9ca3af;
				animation: splashFadeIn 0.8s ease-out 0.4s both;
			}
			#splash-dots {
				display: flex;
				gap: 8px;
				margin-top: 32px;
				animation: splashFadeIn 0.8s ease-out 0.6s both;
			}
			#splash-dots span {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: #dc2626;
				animation: splashBounce 1.4s ease-in-out infinite;
			}
			#splash-dots span:nth-child(2) {
				animation-delay: 0.2s;
				background: #f59e0b;
			}
			#splash-dots span:nth-child(3) {
				animation-delay: 0.4s;
				background: #dc2626;
			}
			@keyframes splashPulse {
				0%, 100% { transform: scale(1); }
				50% { transform: scale(1.05); }
			}
			@keyframes splashFadeIn {
				from { opacity: 0; transform: translateY(12px); }
				to { opacity: 1; transform: translateY(0); }
			}
			@keyframes splashBounce {
				0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
				40% { transform: scale(1); opacity: 1; }
			}
		</style>
	</head>
	<body>
		<!-- Splash screen (removed after React hydrates) -->
		<div id="splash-screen">
			<img id="splash-logo" src="/logo-dpmd.png" alt="DPMD" />
			<div id="splash-text">DPMD Kab. Bogor</div>
			<div id="splash-subtitle">Dinas Pemberdayaan Masyarakat dan Desa</div>
			<div id="splash-dots"><span></span><span></span><span></span></div>
		</div>

		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
